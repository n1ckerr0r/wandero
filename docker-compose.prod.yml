services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}

  migrate:
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}

  backend:
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      API_WRITE_KEY: ${API_WRITE_KEY:?API_WRITE_KEY must be set}
