x-db-environment: &db-environment
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USER: ${DB_USER:-chronograph}
  DB_PASSWORD: ${DB_PASSWORD:-chronograph}
  DB_NAME: ${DB_NAME:-chronograph}
  DB_SSLMODE: disable

services:
  postgres:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: ${DB_NAME:-chronograph}
      POSTGRES_USER: ${DB_USER:-chronograph}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chronograph}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  migrate:
    build: ./backend
    entrypoint: ["/app/migrate"]
    environment: *db-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    environment:
      <<: *db-environment
      SERVER_ADDR: :8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      API_WRITE_KEY: ${API_WRITE_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    profiles: ["docs"]
    ports:
      - "127.0.0.1:${SWAGGER_PORT:-8081}:8080"
    environment:
      SWAGGER_JSON: /openapi.yaml
    volumes:
      - ./backend/api/openapi.yaml:/openapi.yaml:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
